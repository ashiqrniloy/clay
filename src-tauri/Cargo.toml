[package]
name = "clay-desktop"
version = "0.1.0"
edition = "2024"
description = "Clay Tauri v2 desktop shell"

[lib]
name = "clay_desktop_lib"
# rlib only: the mobile targets (staticlib/cdylib) cannot link V8 from
# deno_core — its TLS relocations are incompatible with -shared. Revisit
# only if a mobile shell is ever planned (it would need an out-of-process
# JS runtime strategy).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "file_chooser"] }
clay = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2", features = [] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros", "net"] }
url = { version = "2.5.8", default-features = false }

[features]
# Debug `cargo build` / `cargo run` embed frontend/dist. `tauri dev` passes
# `--no-default-features` so the webview still loads Vite at devUrl.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
