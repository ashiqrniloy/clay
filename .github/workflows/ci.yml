name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One Linux job and one normal target directory keep every blocking gate on
  # the same artifacts. Audit exceptions are documented in
  # `docs/development/security.md` and expiry-checked by the protocol suite.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Tauri v2 Linux build prerequisites for the src-tauri workspace member
      # (clay-desktop). Keep in sync with docs/development/build-and-test.md.
      - name: Install Tauri v2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      # JS toolchain (bun + transitional node) comes from the root mise.toml
      # so local and CI cannot drift.
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - name: Frontend gates (lint, format, unit tests, production build)
        run: |
          cd frontend
          bun install --frozen-lockfile
          bun run lint
          bun run format:check
          bun run test
          bun run build
          bun run check:budget
      - name: clay-agent unit tests
        run: |
          cd clay-agent
          bun install --frozen-lockfile
          bun run test
      - name: Packaged-release smoke (identity, artifacts, budgets)
        run: scripts/package-smoke.sh
      - run: scripts/check.sh full
      - name: Report build storage
        if: always()
        run: scripts/check.sh report
