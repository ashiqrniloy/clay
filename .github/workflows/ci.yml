name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One Linux job and one normal target directory keep every blocking gate on
  # the same artifacts. Audit exceptions are documented in
  # `docs/development/security.md` and expiry-checked by the protocol suite.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: scripts/check.sh full
      - name: Report build storage
        if: always()
        run: scripts/check.sh report
